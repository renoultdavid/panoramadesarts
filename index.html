<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Visuel &amp; Synchronique des Arts et Civilisations</title>

  <!-- Polices Muséales Lapidaires -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Feuille de style externe -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. SCÈNE CARTOGRAPHIQUE -->
  <div id="map-viewport">
    <div id="map-canvas-frame">
      <div id="global-map-stage"></div>
      
      <!-- Halos synchrones précis et proportionnés -->
      <div id="synchronous-halos-layer">
        <!-- Halo Canaries : calé pile au large sur les îles -->
        <div id="halo-canaries" class="sync-foyer-halo"></div>
        
        <!-- Halo Amorrites : Syrie / Proche-Orient -->
        <div id="halo-amorrite" class="sync-foyer-halo"></div>
      </div>

      <!-- Carte régionale recouvrant l'écran (Amorrite ou Canaries) -->
      <div id="civilisation-map-overlay">
        <div id="beacon-container"></div>
      </div>
    </div>
  </div>

  <!-- 2. CARTOUCHE LATÉRAL VERROUILLABLE AVEC BANDEAU VISUEL -->
  <aside id="hover-sidebar-card" class="pos-left">
    <button class="btn-close-sidebar" id="btn-close-sidebar" title="Fermer la fiche">&times;</button>
    <div class="hover-card-era" id="sidebar-era">Époque</div>
    <div class="hover-card-title" id="sidebar-title">Civilisation</div>
    
    <div class="hover-banner-frame" id="sidebar-banner-box">
      <img id="sidebar-banner-img" src="" alt="Bandeau de la civilisation" loading="lazy" />
    </div>

    <div class="hover-card-desc" id="sidebar-desc">Notice muséographique...</div>
    
    <button class="btn-enter-civ-map" id="btn-enter-civ">
      Explorer la carte régionale ➔
    </button>
  </aside>

  <!-- 3. EN-TÊTE ÉPURÉ -->
  <header>
    <div class="museum-insignia">
      <div class="insignia-title">Atlas Visuel des Arts</div>
      <div class="insignia-sub">Collections photographiques &amp; Archives in situ</div>
    </div>
  </header>

  <!-- 4. LES DEUX FRISES SUPERPOSÉES -->
  <div id="timeline-dock">

    <!-- Étage 2 : Temps ralenti (déplié au-dessus) -->
    <div id="sub-timeline-drawer">
      <div class="drawer-info-strip">
        <span class="drawer-civ-tag" id="drawer-civ-name">CHRONOLOGIE DÉPLOYÉE</span>
        <button class="btn-close-sub" id="btn-close-drawer">← Revenir à la Carte Globale</button>
      </div>
      <div id="sub-stream-scroll"></div>
    </div>

    <!-- Étage 1 : Frise maîtresse synchronique avec graduation millimétrée -->
    <div id="master-timeline-bar">
      
      <!-- Règle temporelle graduée -->
      <div id="ruler-scale-bar">
        <div id="ruler-ticks-track"></div>
      </div>

      <!-- Ligne fine verticale de coupe temporelle synchronique -->
      <div id="sync-cursor-line">
        <div id="sync-bubble-tag">-1950 av. J.-C.</div>
      </div>

      <div id="master-drag-container">
        <div id="master-ribbon">
          <!-- Couloir 1 : Atlantique & Canaries -->
          <div class="timeline-lane" data-lane="atlantique">
            <span class="lane-label">Canaries &amp; Atlantique</span>
          </div>

          <!-- Couloir 2 : Levant & Syrie (Amorrites) -->
          <div class="timeline-lane" data-lane="syrie">
            <span class="lane-label">Syrie &amp; Levant</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- 5. POP-UP D'EXPOSITION MUSÉALE (FOCUS OBJET SUR GRIS DE PAYNE) -->
  <div id="curator-modal">
    <div class="curator-frame">
      <button class="btn-dismiss-modal" id="btn-modal-close">&times;</button>
      
      <div class="modal-pedestal-col">
        <img id="modal-artwork-img" src="" alt="Objet d'art de la collection" loading="lazy" />
      </div>

      <div class="modal-notes-col">
        <div class="modal-civ-line" id="modal-civ-title">Civilisation</div>
        <h2 class="modal-headline" id="modal-artwork-title">Titre de l'Œuvre</h2>
        
        <div class="modal-chips-row" id="modal-chips-container"></div>

        <p class="modal-narrative" id="modal-narrative-text">Notice détaillée...</p>

        <a href="#" target="_blank" rel="noopener noreferrer" class="btn-gold-link" id="modal-album-btn">
          Explorer l'album complet
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Script logique externe -->
  <script src="app.js"></script>
</body>
</html>
